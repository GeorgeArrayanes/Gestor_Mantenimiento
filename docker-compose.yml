services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mantenimiento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - mantenimiento_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantenimiento"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mantenimiento_pgdata:
