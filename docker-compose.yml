services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rutasegura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - rutasegura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rutasegura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rutasegura_pgdata:
